# Every third-party `uses:` is a full 40-hex commit SHA with a trailing
# `# vX.Y.Z` comment. A tag is mutable and can be repointed by anyone who can
# push to that action's repo; the SHA is the only immutable reference. The
# comment is what makes a Dependabot bump reviewable by a human rather than an
# opaque hex swap -- so never remove it, and never let it drift from the SHA.
name: build-and-test
on:
  pull_request:
  push:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    steps:
      # GitHub opens Dependabot SECURITY fixes against the default branch
      # only; `target-branch` in dependabot.yml steers version updates alone.
      # With any default but develop, every security fix lands outside the
      # develop gate. First step, so a wrong default fails in seconds (issue shyden-labs/repo-template#46).
      - name: The default branch is develop
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$DEFAULT_BRANCH" != "develop" ]; then
            echo "::error::The default branch is '$DEFAULT_BRANCH', not develop, so Dependabot security fixes open outside the develop gate. Set it in Settings > General > Default branch."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The exact Node, from the one file Dependabot bumps (shyden-labs/repo-template#143).
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
      - run: node scripts/npm-ci.ts
      # Any known vulnerability, of any severity and dev dependencies included, fails the build (shyden-labs/repo-template#156).
      - name: Audit
        run: npm audit --audit-level=low
      # The static checks (issue shyden-labs/repo-template#61); .githooks/pre-push runs the same three before every push.
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - run: npm run test:unit

  # Coverage runs apart from the 1 s unit step: one overall threshold over the
  # TypeScript under scripts/ (vitest.unit.config.ts, shyden-labs/repo-template#149).
  coverage:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The exact Node, from the one file Dependabot bumps (shyden-labs/repo-template#143).
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
      - run: node scripts/npm-ci.ts
      - run: npm run test:coverage

  # The integration suite against real D1 on ShyDesk Non-Prod (shyden-labs/shydesk#15):
  # one disposable database per run, created and deleted by the suite. `dev-ci`
  # holds a D1-only token any branch may use; the deploy token stays in `dev`.
  integration:
    runs-on: ubuntu-26.04
    environment: dev-ci
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The exact Node, from the one file Dependabot bumps (shyden-labs/repo-template#143).
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
      - run: node scripts/npm-ci.ts
      - name: Integration suite
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run test:integration

  # The one end-to-end suite on the desktop targets (shyden-labs/shydesk#42): Chrome,
  # Firefox and Safari in one run on macOS, the only runner with all three, so the
  # totals compare in the same job. The phones run the same suite over USB.
  e2e-desktop:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The exact Node, from the one file Dependabot bumps (shyden-labs/repo-template#143).
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
      - run: node scripts/npm-ci.ts
      # Safari's driver ships with macOS but answers only once enabled.
      - name: Enable safaridriver
        run: sudo safaridriver --enable
      # The runner image's own drivers, matching its Chrome and Firefox, so the run
      # never downloads one mid-run (shyden-labs/shydesk#77). A missing one fails by name.
      - name: Find the preinstalled Chrome and Firefox drivers
        run: |
          chromedriver="${CHROMEWEBDRIVER:?the runner image sets no CHROMEWEBDRIVER}/chromedriver"
          geckodriver="${GECKOWEBDRIVER:?the runner image sets no GECKOWEBDRIVER}/geckodriver"
          test -x "$chromedriver" || { echo "no chromedriver at $chromedriver"; exit 1; }
          test -x "$geckodriver" || { echo "no geckodriver at $geckodriver"; exit 1; }
          echo "E2E_DESKTOP_CHROMEDRIVER=$chromedriver" >> "$GITHUB_ENV"
          echo "E2E_GECKODRIVER=$geckodriver" >> "$GITHUB_ENV"
      - name: End-to-end suite on every desktop target
        env:
          E2E_TARGETS: chromium,firefox,safari
        run: npm run test:e2e
      # Each failed test's window, so a failure is seen, not guessed (shyden-labs/shydesk#108).
      - name: Keep the windows of failed tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-desktop-failures
          path: .e2e-runs/*.png
          if-no-files-found: ignore
          retention-days: 7

  # The SonarCloud quality gate, blocking (shyden-labs/repo-template#27, shyden-labs/repo-template#60): the reusable workflow
  # scans, then fails unless this scan's gate is OK (docs/sonarcloud.md).
  sonarcloud:
    uses: ./.github/workflows/sonarcloud.yml
    with:
      organization: shyden-labs
      project-key: shyden-labs_shydesk
    secrets: inherit
