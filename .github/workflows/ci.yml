# Every third-party `uses:` is a full 40-hex commit SHA with a trailing
# `# vX.Y.Z` comment. A tag is mutable and can be repointed by anyone who can
# push to that action's repo; the SHA is the only immutable reference. The
# comment is what makes a Dependabot bump reviewable by a human rather than an
# opaque hex swap -- so never remove it, and never let it drift from the SHA.
name: build-and-test
on:
  pull_request:
  push:
    branches: [develop]

# Read-only unless a job says otherwise (shyden-labs/shydesk#313): the repository's default token can write
# and approve pull requests, and every job here runs third-party install scripts.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    steps:
      # GitHub opens Dependabot SECURITY fixes against the default branch
      # only; `target-branch` in dependabot.yml steers version updates alone.
      # With any default but develop, every security fix lands outside the
      # develop gate. First step, so a wrong default fails in seconds (issue shyden-labs/repo-template#46).
      - name: The default branch is develop
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$DEFAULT_BRANCH" != "develop" ]; then
            echo "::error::The default branch is '$DEFAULT_BRANCH', not develop, so Dependabot security fixes open outside the develop gate. Set it in Settings > General > Default branch."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The exact Node, from the one file Dependabot bumps (shyden-labs/repo-template#143).
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Node's download, kept between runs under its exact version (shyden-labs/shydesk#305):
      # a Dockerfile bump misses this cache, so the new version downloads.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: ${{ runner.tool_cache }}/node/${{ steps.node.outputs.version }}
          key: node-${{ steps.node.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
      - run: node scripts/npm-ci.ts
        timeout-minutes: 10
      # Any known vulnerability, of any severity and dev dependencies included, fails the build (shyden-labs/repo-template#156).
      - name: Audit
        run: node scripts/audit.ts
      # The static checks (issue shyden-labs/repo-template#61); .githooks/pre-push runs the same three before every push.
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - run: npm run test:unit

  # Coverage runs apart from the 1 s unit step: one overall threshold over the
  # TypeScript under scripts/ (vitest.unit.config.ts, shyden-labs/repo-template#149).
  coverage:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The exact Node, from the one file Dependabot bumps (shyden-labs/repo-template#143).
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Node's download, kept between runs under its exact version (shyden-labs/shydesk#305):
      # a Dockerfile bump misses this cache, so the new version downloads.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: ${{ runner.tool_cache }}/node/${{ steps.node.outputs.version }}
          key: node-${{ steps.node.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
      - run: node scripts/npm-ci.ts
        timeout-minutes: 10
      - run: npm run test:coverage

  # The integration suite against real D1 on ShyDesk Non-Prod (shyden-labs/shydesk#15):
  # one disposable database per run, created and deleted by the suite. `dev-ci`
  # holds a D1-only token any branch may use; the deploy token stays in `dev`.
  integration:
    runs-on: ubuntu-26.04
    environment: dev-ci
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The exact Node, from the one file Dependabot bumps (shyden-labs/repo-template#143).
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # This job holds a Cloudflare token, so it restores nothing from the cache (shyden-labs/shydesk#305).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: ${{ steps.node.outputs.version }}
      - run: node scripts/npm-ci.ts
        timeout-minutes: 10
      - name: Integration suite
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run test:integration

  # The one end-to-end suite on the desktop targets (shyden-labs/shydesk#42): Chrome,
  # Firefox and Safari in one run on macOS, the only runner with all three, so the
  # totals compare in the same job. The phones run the same suite over USB.
  e2e-desktop:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The exact Node, from the one file Dependabot bumps (shyden-labs/repo-template#143).
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Node's download, kept between runs under its exact version (shyden-labs/shydesk#305):
      # a Dockerfile bump misses this cache, so the new version downloads.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: ${{ runner.tool_cache }}/node/${{ steps.node.outputs.version }}
          key: node-${{ steps.node.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
      - run: node scripts/npm-ci.ts
        timeout-minutes: 10
      # Safari's driver ships with macOS but answers only once enabled.
      - name: Enable safaridriver
        run: sudo safaridriver --enable
      # The runner image's own drivers, matching its Chrome and Firefox, so the run
      # never downloads one mid-run (shyden-labs/shydesk#77). A missing one fails by name.
      - name: Find the preinstalled Chrome and Firefox drivers
        run: |
          chromedriver="${CHROMEWEBDRIVER:?the runner image sets no CHROMEWEBDRIVER}/chromedriver"
          geckodriver="${GECKOWEBDRIVER:?the runner image sets no GECKOWEBDRIVER}/geckodriver"
          test -x "$chromedriver" || { echo "no chromedriver at $chromedriver"; exit 1; }
          test -x "$geckodriver" || { echo "no geckodriver at $geckodriver"; exit 1; }
          echo "E2E_DESKTOP_CHROMEDRIVER=$chromedriver" >> "$GITHUB_ENV"
          echo "E2E_GECKODRIVER=$geckodriver" >> "$GITHUB_ENV"
      # The runner's Chrome updates itself mid-job (run 43468019143: 156.0.8078.80 before the
      # suite, 157.0.8103.51 after), so every session starts a copy made now, which matches the
      # image's chromedriver and which the updater never touches (shyden-labs/shydesk#135).
      - name: Copy Chrome before the suite
        run: |
          copy="$RUNNER_TEMP/chrome/Google Chrome.app"
          mkdir -p "$RUNNER_TEMP/chrome"
          ditto "/Applications/Google Chrome.app" "$copy"
          binary="$copy/Contents/MacOS/Google Chrome"
          "$binary" --version
          echo "E2E_DESKTOP_CHROME=$binary" >> "$GITHUB_ENV"
      - name: End-to-end suite on every desktop target
        # DIAGNOSTIC ONLY (shyden-labs/shydesk#188), never merged: the contact journey on real Safari, 8 times.
        env:
          E2E_TARGETS: safari
        run: |
          pass=0; fail=0
          for i in 1 2 3 4 5 6 7 8; do
            DIAG_REPEAT=$i ./node_modules/.bin/wdio run wdio.conf.ts --spec tests/e2e/contact.e2e.ts > "$RUNNER_TEMP/run$i.log" 2>&1
            if [ $? -eq 0 ]; then pass=$((pass+1)); echo "repeat $i: passed"; else fail=$((fail+1)); echo "repeat $i: FAILED"; grep -E "Error|never|video|Video" "$RUNNER_TEMP/run$i.log" | cut -c1-500 | head -12; fi
          done
          echo "real Safari: $pass passed, $fail failed"
          [ $fail -eq 0 ]

  # The e2e suite on Playwright through the shared device layer, on every desktop browser it gives
  # (shyden-labs/shydesk#176). It runs beside e2e-desktop until every test is ported, then replaces it.
  e2e-playwright:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The exact Node, from the one file Dependabot bumps (shyden-labs/repo-template#143).
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Node's download, kept between runs under its exact version (shyden-labs/shydesk#305):
      # a Dockerfile bump misses this cache, so the new version downloads.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: ${{ runner.tool_cache }}/node/${{ steps.node.outputs.version }}
          key: node-${{ steps.node.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
      - run: node scripts/npm-ci.ts
        timeout-minutes: 10
      # Playwright's own browsers, kept between runs under the exact Playwright version npm installed
      # (shyden-labs/shydesk#305): a Dependabot bump misses this cache, so that version's browsers download.
      - id: playwright
        run: ./node_modules/.bin/playwright --version | sed -nE 's/^Version ([0-9]+\.[0-9]+\.[0-9]+)$/version=\1/p' >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      # Each browser shyden-labs/playwright-devices names, installed for the Playwright in the lockfile;
      # a channel that cannot install fails here by name. Cached browsers are not fetched again; the
      # branded chrome and msedge channels and the OS packages still come from their sources, so stay current.
      - name: Install the desktop browsers
        timeout-minutes: 10
        run: ./node_modules/.bin/playwright install --with-deps chromium chrome firefox webkit msedge
      # The test list each browser should run, read before the run so a browser that runs fewer is named (shyden-labs/shydesk#176).
      # It lives outside .e2e-runs, which the suite's global setup empties when the run starts.
      - name: List the tests each desktop browser runs
        run: ./node_modules/.bin/playwright test --config playwright.config.ts --list --reporter=json > "$RUNNER_TEMP/playwright-list.json"
      - name: End-to-end suite on every desktop browser
        run: npm run test:e2e:pw
      # Checked even after a red run; this step's own exit fails the job on any difference between browsers.
      - name: Every desktop browser ran the same tests and assertions
        if: always()
        run: ./node_modules/.bin/one-suite --group desktop=chromium,chrome,firefox,webkit,msedge --list "$RUNNER_TEMP/playwright-list.json" --report .e2e-runs/playwright-report.json --assertions .e2e-runs/assertions.json

  # The SonarCloud quality gate, blocking (shyden-labs/repo-template#27, shyden-labs/repo-template#60): the reusable workflow
  # scans, then fails unless this scan's gate is OK (docs/sonarcloud.md).
  sonarcloud:
    # What sonarcloud.yml asks for; a called workflow can never hold more than its caller gives it.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/sonarcloud.yml
    with:
      organization: shyden-labs
      project-key: shyden-labs_shydesk
    secrets: inherit
