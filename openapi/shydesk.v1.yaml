# ShyDesk's public API (shyden-labs/shydesk#26), written by hand and checked
# against the Worker by tests/unit/openapi-contract.test.ts: every route under
# /api/v1 and /support-api is here, and every response validates.
openapi: 3.1.0
info:
  title: ShyDesk API
  version: 1.0.0
  description: >-
    Product servers read their tickets through /api/v1 with the API key made
    for them on the ShyDesk admin screen. The key is sent as a Bearer token and
    only ever belongs to one product. The shared support piece calls the
    /support-api routes from a product's own support page (docs/embedding.md):
    they need no key, and answer only the product's allowed origins, naming
    that exact origin in Access-Control-Allow-Origin; any other origin gets
    404 with no CORS header.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://shydesk.dpdns.org
    description: Live
security:
  - productKey: []
paths:
  /api/v1/products/{product}/feed:
    get:
      operationId: getProductFeed
      summary: New and changed tickets of one product, oldest change first.
      description: >-
        Every change to a ticket gives it the next sequence number (`seq`), so
        a caller that keeps `next_cursor` and sends it back as `since_cursor`
        sees each change once. A ticket changed again comes back again with its
        new `seq`. An empty page keeps the cursor it was sent.
      parameters:
        - name: product
          in: path
          required: true
          description: The product id the key was made for.
          schema:
            type: string
        - name: since_cursor
          in: query
          required: false
          description: The `next_cursor` of the last page read; 0 or left out starts from the beginning.
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
            default: 0
        - name: limit
          in: query
          required: false
          description: Most tickets in one page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: One page of changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPage'
        '400':
          description: '`since_cursor` or `limit` is not a whole number in range.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No key, or the key is unknown or revoked.
          headers:
            WWW-Authenticate:
              schema:
                type: string
                const: Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The key belongs to another product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /support-api/config:
    get:
      operationId: getSupportConfig
      summary: The contact form's settings for one product.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductQuery'
      responses:
        '200':
          description: The form's settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportConfig'
        '404':
          description: An unknown product, or an origin not on its list. No CORS header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /support-api/tickets:
    post:
      operationId: createSupportTicket
      summary: A new support request from the contact form.
      description: >-
        Checked field by field, then by Turnstile (solved on one of the
        product's own hosts), then by 20 requests per network address and 5
        per email address per hour. The ticket stands even when the notice
        email could not be sent; `emailSent` says which.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTicket'
      responses:
        '201':
          description: The ticket was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketCreated'
        '400':
          description: >-
            A field is missing or wrong (`errors`, one message per field), the
            Turnstile check failed (`errors.turnstileToken`), or the body could
            not be read (`error`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FieldErrors'
                  - $ref: '#/components/schemas/Error'
        '404':
          description: An unknown product, an origin not on its list (no CORS header), or a product with no support type yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests from this email or network address in the last hour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: This ShyDesk has no Turnstile secret set, so no request can be checked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /support-api/uploads:
    post:
      operationId: startUpload
      summary: Starts an attachment upload in parts.
      description: >-
        No per-file size limit: only the free storage can refuse it here. Limited
        to 30 starts per network address and 300 per product per hour.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUpload'
      responses:
        '201':
          description: Started. Send `parts` parts, each `partSize` bytes but the last.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadStarted'
        '400': { $ref: '#/components/responses/UploadError' }
        '404': { $ref: '#/components/responses/UploadError' }
        '422': { $ref: '#/components/responses/UploadError' }
        '429': { $ref: '#/components/responses/UploadError' }
  /support-api/uploads/{id}/parts/{n}:
    put:
      operationId: sendUploadPart
      summary: One part's raw bytes, numbered from 1.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductQuery'
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: n, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Stored. Keep the etag for `complete`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadPart'
        '400': { $ref: '#/components/responses/UploadError' }
        '404': { $ref: '#/components/responses/UploadError' }
        '411': { $ref: '#/components/responses/UploadError' }
        '413': { $ref: '#/components/responses/UploadError' }
  /support-api/uploads/{id}/complete:
    post:
      operationId: completeUpload
      summary: Finishes an upload, keeping the file only if its content passes.
      description: >-
        The file must really be a JPEG, WebP or MP4 of the declared type, and a
        video at most 30 seconds long. A refused file is deleted.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductQuery'
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteUpload'
      responses:
        '200': { $ref: '#/components/responses/UploadOk' }
        '400': { $ref: '#/components/responses/UploadError' }
        '404': { $ref: '#/components/responses/UploadError' }
        '422': { $ref: '#/components/responses/UploadError' }
  /support-api/uploads/{thumbId}:
    put:
      operationId: sendUploadThumbnail
      summary: The preview image of a finished upload, at most 1 MB, JPEG or WebP.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductQuery'
        - { name: thumbId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/UploadOk' }
        '404': { $ref: '#/components/responses/UploadError' }
        '409': { $ref: '#/components/responses/UploadError' }
        '411': { $ref: '#/components/responses/UploadError' }
        '413': { $ref: '#/components/responses/UploadError' }
        '422': { $ref: '#/components/responses/UploadError' }
components:
  parameters:
    ProductQuery:
      name: product
      in: query
      required: true
      schema:
        type: string
      description: The product id, as set on the ShyDesk admin screen.
  securitySchemes:
    productKey:
      type: http
      scheme: bearer
      description: The product's API key, made on the ShyDesk admin screen. Only its hash is stored.
  responses:
    UploadOk:
      description: Done.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ok]
            properties:
              ok: { type: boolean, const: true }
    UploadError:
      description: Refused, saying why.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    FeedPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/TicketSummary'
        next_cursor:
          type: integer
          minimum: 0
          description: Send back as `since_cursor` to read the changes after this page.
    TicketSummary:
      type: object
      additionalProperties: false
      required: [id, status, subject, category, created_at, updated_at, closed_at, seq]
      description: A ticket without the customer's details or any message text.
      properties:
        id:
          type: string
        status:
          type: string
          enum: [open, waiting, closed]
        subject:
          type: string
          maxLength: 150
        category:
          type: string
          enum: [question, bug, account, payment, other]
        created_at:
          type: integer
          description: Milliseconds since 1970-01-01 UTC.
        updated_at:
          type: integer
          description: Milliseconds since 1970-01-01 UTC.
        closed_at:
          type: [integer, 'null']
          description: Milliseconds since 1970-01-01 UTC, or null while the ticket is open or waiting.
        seq:
          type: integer
          minimum: 1
    SupportConfig:
      type: object
      additionalProperties: false
      required: [product, types, categories, turnstileSiteKey, maxAttachments, maxVideoSeconds]
      properties:
        product:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        types:
          type: array
          description: The product's support type, or none while it has not been set up.
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [id, name, fields]
            properties:
              id:
                type: string
              name:
                type: string
              fields:
                type: array
                items:
                  $ref: '#/components/schemas/SupportField'
        categories:
          type: array
          items:
            type: string
            enum: [question, bug, account, payment, other]
        turnstileSiteKey:
          type: string
        maxAttachments:
          type: integer
          const: 10
        maxVideoSeconds:
          type: integer
          const: 30
    SupportField:
      type: object
      additionalProperties: false
      required: [label, kind, required]
      properties:
        label:
          type: string
        kind:
          type: string
          enum: [text, select]
        required:
          type: boolean
        options:
          type: array
          items:
            type: string
    NewTicket:
      type: object
      required: [email, subject, category, message, turnstileToken]
      properties:
        email:
          type: string
          maxLength: 254
        subject:
          type: string
          maxLength: 150
        category:
          type: string
          enum: [question, bug, account, payment, other]
        message:
          type: string
          maxLength: 10000
        fields:
          type: object
          description: The support type's extra fields, by label. Others are dropped.
          additionalProperties:
            type: string
            maxLength: 1000
        attachmentIds:
          type: array
          maxItems: 10
          items:
            type: string
        turnstileToken:
          type: string
    TicketCreated:
      type: object
      additionalProperties: false
      required: [ticketLink, emailSent]
      properties:
        ticketLink:
          type: string
          description: The product's ticket page with `#t=` and the 43-character private token. Shown once.
        emailSent:
          type: boolean
          description: False when the notice email could not be sent; the customer should keep the link.
    NewUpload:
      type: object
      required: [kind, mime, bytes]
      properties:
        kind: { type: string, enum: [image, video] }
        mime: { type: string, enum: [image/jpeg, image/webp, video/mp4] }
        bytes: { type: integer, minimum: 1 }
    UploadStarted:
      type: object
      additionalProperties: false
      required: [id, partSize, parts, thumbId]
      properties:
        id: { type: string }
        partSize: { type: integer, const: 8388608 }
        parts: { type: integer, minimum: 1 }
        thumbId: { type: string }
    UploadPart:
      type: object
      additionalProperties: false
      required: [etag]
      properties:
        etag: { type: string }
    CompleteUpload:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          items:
            type: object
            required: [n, etag]
            properties:
              n: { type: integer, minimum: 1 }
              etag: { type: string }
    FieldErrors:
      type: object
      additionalProperties: false
      required: [errors]
      properties:
        errors:
          type: object
          description: One message per field, keyed by field name (`fields.<label>` for extra fields).
          additionalProperties:
            type: string
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
